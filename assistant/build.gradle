plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv("MYASSISTSTORE_PATH") ?: ""
def releaseKeystorePass = System.getenv("MYASSIST_KEYSTORE_PASS") ?: ""

android {
    namespace 'com.myassist.assistant'
    compileSdk 35
    defaultConfig {
        applicationId "com.myassist.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            storeFile file(releaseKeystorePath ? releaseKeystorePath : "keystore/myassist-release.jks")
            storePassword releaseKeystorePass
            keyAlias "myassist"
            keyPassword releaseKeystorePass
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:8000"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://API-DOMAIN-PENDING"'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    testImplementation 'junit:junit:4.13.2'
}
